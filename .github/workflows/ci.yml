name: C++ build, tests and visual demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Debug
          - os: ubuntu-latest
            build_type: Release
          - os: windows-latest
            build_type: Debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Unit and scenario tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Verify training works
        run: ./build/autodrive_train config/new_weights.txt
        if: runner.os == 'Linux'
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with address/undefined behavior sanitizers
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitize --parallel
      - run: ctest --test-dir build-sanitize --output-on-failure
  visualization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-viz.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: mkdir -p docs/assets && ./build/autodrive_demo --output docs/assets/telemetry.csv
      - run: python scripts/render_demo.py --csv docs/assets/telemetry.csv --out docs/assets
      - uses: actions/upload-artifact@v4
        with:
          name: driving-demo-media
          path: |
            docs/assets/*.png
            docs/assets/*.gif
            docs/assets/*.mp4
            docs/assets/telemetry.csv