name: Install verified Stage 8 upgrade
on:
  push:
    branches:
      - feature/stage8-industry-visuals-telemetry
    paths:
      - .stage8_source_bundle.b64
      - .github/workflows/stage8-bootstrap.yml
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract reviewed source bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile, hashlib
          b64 = Path('.stage8_source_bundle.b64').read_text().strip()
          payload = base64.b64decode(b64, validate=True)
          expected = 'd6b35a4c078c38f065a2ee54822cf4bad2ed83f79d4fb43a58d8a9ecf7993bc5'
          assert hashlib.sha256(payload).hexdigest() == expected, 'bundle integrity mismatch'
          archive = io.BytesIO(lzma.decompress(payload))
          with tarfile.open(fileobj=archive, mode='r:') as tf:
              members = tf.getmembers()
              assert all(m.isfile() and not m.name.startswith('/') and '..' not in Path(m.name).parts for m in members)
              tf.extractall('.')
          print('Extracted', len(members), 'project source files')
          PY
          rm -f .stage8_source_bundle.b64
          rm -f src/autodrive.cpp include/autodrive.hpp
          mkdir -p docs/legacy
          if test -f docs/LEARNING_GUIDE.md; then
            mv docs/LEARNING_GUIDE.md docs/legacy/LEARNING_GUIDE_STAGE1_7.md
          fi
      - name: Build and run C++ tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image rendering dependencies
        run: |
          python -m pip install -r requirements-viz.txt
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Create real simulation plots, GIF and MP4
        run: |
          mkdir -p docs/assets
          ./build/autodrive_demo --model config/risk_model.txt --output docs/assets/telemetry.csv
          python scripts/render_demo.py --csv docs/assets/telemetry.csv --out docs/assets
          test -s docs/assets/autodrive_demo.gif
          test -s docs/assets/autodrive_demo.mp4
          test -s docs/assets/route_map.png
      - name: Publish finished project and remove temporary bootstrap
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/stage8-bootstrap.yml
          git add -A
          git commit -m "Stage 8: modular C++ autonomy demo, safety tests, visual graphs and driving video"
          git push origin HEAD:feature/stage8-industry-visuals-telemetry
